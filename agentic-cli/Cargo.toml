[package]
name = "agentic-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for AI agent orchestration using core-agentic"
authors = ["Termul Team"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "agentic"
path = "src/main.rs"

[dependencies]
core-agentic = { path = "../core-agentic" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
 dirs = "5.0"