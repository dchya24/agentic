[package]
name = "agentic-cli"
version = "0.2.0"
edition = "2021"
description = "CLI for AI agent orchestration using core-agentic"
authors = ["Termul Team"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "agentic"
path = "src/main.rs"

[dependencies]
core-agentic = { path = "../core-agentic" }
clap = { version = "4.5", features = ["derive", "string"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5.0"
pulldown-cmark = "0.10"
termcolor = "1.4"
dialoguer = "0.11"
indicatif = "0.17"
comfy-table = "7"
chrono = "0.4"
console = "0.15"
rustyline = { version = "14", features = ["derive", "with-file-history"] }
uuid = { version = "1", features = ["v4"] }
