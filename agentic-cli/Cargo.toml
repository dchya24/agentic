[package]
name = "agentic-cli"
version = "0.3.0"
edition = "2021"
description = "CLI for AI agent orchestration using core-agentic"
authors = ["devchya"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "agentic"
path = "src/main.rs"

[dependencies]
core-agentic = { path = "../core-agentic" }
regex = "1.12"
clap = { version = "4.5", features = ["derive", "string"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5.0"
pulldown-cmark = "0.10"
termcolor = "1.4"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"
comfy-table = "7"
chrono = "0.4"
console = "0.15"
# rustyline removed - using custom ratatui input widget
# reedline removed - replaced by InputBuffer + crossterm raw mode
uuid = { version = "1", features = ["v4"] }

# Terminal management
crossterm = "0.28"

# Unix terminal control (transitive dep — zero compile cost)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
ignore = "0.4"

# TUI
ratatui = "0.29"

[dev-dependencies]
futures = "0.3"
tui-textarea = "0.7"
syntect = "5.2"
