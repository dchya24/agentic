[package]
name = "agentic-cli"
version = "0.4.1"
edition = "2021"
description = "CLI for AI agent orchestration using core-agentic"
authors = ["devchya"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dchya24/agentic"
repository = "https://github.com/dchya24/agentic"

[[bin]]
name = "agentic"
path = "src/main.rs"

[dependencies]
core-agentic = { path = "../core-agentic" }
regex = "1.12"
clap = { version = "4.5", features = ["derive", "string"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5.0"
pulldown-cmark = "0.10"
termcolor = "1.4"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"
comfy-table = "7"
chrono = "0.4"
console = "0.15"
# rustyline removed - using custom ratatui input widget
# reedline removed - replaced by InputBuffer + crossterm raw mode
uuid = { version = "1", features = ["v4"] }

# Terminal management
crossterm = "0.28"

# TUI (full-screen mode)
ratatui = "0.29"

# Filesystem scanning for the TUI dropdown
ignore = "0.4"

# Unix terminal control (transitive dep — zero compile cost)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ── Packaging metadata (cargo-deb → .deb, cargo-generate-rpm → .rpm) ──
[package.metadata.deb]
maintainer = "dchya24 <cahyadinar241@gmail.com>"
copyright = "2026 dchya24 <cahyadinar241@gmail.com>"
section = "utils"
priority = "optional"
extended-description = "AI agent orchestration CLI with an interactive REPL, full-screen TUI, agent safety controls, skill system, and MCP support."

[package.metadata.generate-rpm]
bindir = "/usr/bin"
assets = [
    { source = "target/release/agentic", dest = "/usr/bin/agentic", mode = "755" },
]

[dev-dependencies]
futures = "0.3"
tui-textarea = "0.7"
syntect = "5.2"
