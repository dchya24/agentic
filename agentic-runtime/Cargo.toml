[package]
name = "agentic-runtime"
version = "0.1.0"
edition = "2021"
description = "Headless JSON Lines runtime for core-agentic"
authors = ["devchya"]
license = "MIT"

[[bin]]
name = "agentic-runtime"
path = "src/main.rs"

[dependencies]
core-agentic = { path = "../core-agentic" }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
