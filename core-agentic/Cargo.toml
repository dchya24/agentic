[package]
name = "core-agentic"
version = "0.3.1"
edition = "2021"
description = "Rust library for AI agent orchestration"
authors = ["devchya"]
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
log = "0.4"
async-stream = "0.3"
glob = "0.3.3"
regex = "1.12.3"
async-trait = "0.1"
similar = "2.6"
parking_lot = "0.12"
base64 = "0.22"

# Optional: real BPE tokenizer for accurate token counts.
# Without this feature, estimate_tokens uses a ~4-chars-per-token heuristic,
# which is fast and dependency-free but can be off by 20–30% for code.
tiktoken-rs = { version = "0.6", optional = true }

[features]
default = []
# Enable to use tiktoken's cl100k_base encoder for token counting. Adds
# ~10MB to the binary and ~50ms cold-start, but counts tokens within
# ~2% of OpenAI/Z.AI/Claude's actual usage.
tiktoken = ["dep:tiktoken-rs"]

[dev-dependencies]
tokio-test = "0.4"
