[package]
name = "core-agentic"
version = "0.1.0"
edition = "2021"
description = "Rust library for AI agent orchestration"
authors = ["Termul Team"]
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
log = "0.4"
async-stream = "0.3"

[dev-dependencies]
tokio-test = "0.4"